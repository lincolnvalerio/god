plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.0'
group = 'com.onikoox.deus'
base { archivesName = 'deus' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { deus { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods { deus { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    // Converte os nomes para os de produção (SRG). Sem isto o mod não carrega fora do ambiente de dev.
    finalizedBy 'reobfJar'
    manifest {
        attributes([
            'Specification-Title'   : 'deus',
            'Specification-Vendor'  : 'onikoox',
            'Implementation-Title'  : 'deus',
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'onikoox'
        ])
    }
}
